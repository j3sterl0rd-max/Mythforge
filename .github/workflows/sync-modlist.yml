name: Refresh published mods and changelog
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-mod-list
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python scripts/sync-changelog.py
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - run: python scripts/sync-modlist.py
      - run: npm run build && npm run check
      - name: Publish changed release list
        run: |
          if git diff --quiet -- data/mods.json data/site.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mods.json data/site.json dist
          git commit -m 'Refresh published CurseForge mods and release history'
          git pull --rebase origin main
          git push origin HEAD:main
